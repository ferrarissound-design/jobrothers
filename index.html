<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ジョーブラ - JOE BROS</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d6362f'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif'%3EJ%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
    </div>
    <script>
      // Classic (non-module) script: runs even when the module script below
      // fails to load or parse, so a blank white screen always turns into a
      // readable report. Phones have no reachable developer console, so this
      // overlay is the only channel for diagnosing a failed boot.
      (function () {
        var shown = false;

        function show(title, detail) {
          if (shown) return;
          shown = true;
          var el = document.createElement("div");
          el.style.cssText =
            "position:fixed;inset:0;z-index:9999;background:#0a0a12;color:#fff;" +
            "font-family:sans-serif;padding:20px;box-sizing:border-box;" +
            "white-space:pre-wrap;overflow:auto;line-height:1.6;font-size:14px;" +
            "-webkit-user-select:text;user-select:text;";
          el.textContent = title + "\n\n" + detail + "\n\n" + environment();
          document.body.appendChild(el);
        }

        // Capability probe: the answers identify most device-specific failures
        // without needing a console, and stay readable when copied as text.
        function environment() {
          var lines = ["--- 環境情報 ---"];
          try {
            var c = document.createElement("canvas");
            var gl = c.getContext("webgl2") || c.getContext("webgl");
            lines.push("WebGL: " + (gl ? "利用可能" : "利用不可（描画できません）"));
          } catch (e) {
            lines.push("WebGL: 判定エラー " + e);
          }
          try {
            localStorage.getItem("__jb_probe");
            lines.push("localStorage: 利用可能");
          } catch (e) {
            lines.push("localStorage: ブロック中（" + (e && e.name) + "）");
          }
          lines.push("画面: " + window.innerWidth + "x" + window.innerHeight);
          lines.push("UA: " + navigator.userAgent);
          return lines.join("\n");
        }

        window.__jbShowBootError = function (message) {
          show("初期化中にエラーが発生しました", message);
        };

        // Resource load failures do not bubble, so capture is required to see
        // a <script> or <link> that never arrived.
        window.addEventListener(
          "error",
          function (ev) {
            if (ev.target && ev.target !== window && ev.target.tagName) {
              show(
                "ファイルの読み込みに失敗しました",
                ev.target.tagName + ": " + (ev.target.src || ev.target.href)
              );
              return;
            }
            show("スクリプトエラー", (ev.message || "不明") + "\n" + ((ev.error && ev.error.stack) || ""));
          },
          true
        );

        window.addEventListener("unhandledrejection", function (ev) {
          show("未処理の例外", String((ev.reason && ev.reason.stack) || ev.reason));
        });

        window.setTimeout(function () {
          if (!window.__jbBooted) {
            show(
              "ゲームが起動しませんでした",
              "スクリプトは読み込まれましたが、初期化が完了していません。"
            );
          }
        }, 5000);
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ジョーブラ - JOE BROS</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d6362f'/%3E%3Ctext x='16' y='23' font-size='18' text-anchor='middle' fill='white' font-family='sans-serif'%3EJ%3C/text%3E%3C/svg%3E" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <canvas id="game-canvas"></canvas>
      <div id="ui-root"></div>
    </div>
    <script>
      // Classic (non-module) script: runs even when the module script below
      // fails silently (e.g. opened via file://, or served without a
      // TypeScript-aware dev server), so a blank white screen always shows
      // a diagnostic message instead of nothing.
      window.__jbShowBootError = function (message) {
        var el = document.createElement("div");
        el.style.cssText =
          "position:fixed;inset:0;z-index:9999;background:#0a0a12;color:#fff;" +
          "font-family:sans-serif;padding:24px;box-sizing:border-box;" +
          "white-space:pre-wrap;overflow:auto;line-height:1.6;";
        el.textContent = message;
        document.body.appendChild(el);
      };
      window.setTimeout(function () {
        if (!window.__jbBooted) {
          window.__jbShowBootError(
            "画面が読み込まれていません。\n\n" +
              "考えられる原因:\n" +
              "・index.html をファイルとして直接開いている（file://）\n" +
              "  → 'npm run dev' で開発サーバーを起動してアクセスしてください\n" +
              "・ビルドせずに静的サーバーでソースを配信している\n" +
              "  → 'npm run build' 後に生成される dist/ フォルダを配信してください\n\n" +
              "詳細はブラウザの開発者コンソールを確認してください。"
          );
        }
      }, 4000);
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
